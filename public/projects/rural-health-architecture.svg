<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Rural health assistant architecture diagram">
  <rect width="1600" height="900" fill="#f0fdf4"/>
  <text x="120" y="110" font-size="56" font-family="Segoe UI, Arial, sans-serif" fill="#14532d" font-weight="700">Rural Health Assistant Architecture</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#14532d" font-size="28">
    <rect x="120" y="180" width="420" height="520" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="160" y="250" font-weight="700">Input Interface</text>
    <text x="160" y="306">Bangla + English symptoms</text>
    <text x="160" y="352">Patient context fields</text>
    <text x="160" y="398">Accessibility-first UX</text>

    <rect x="600" y="180" width="440" height="520" rx="24" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
    <text x="640" y="250" font-weight="700">Inference Engine</text>
    <text x="640" y="306">TF-IDF vectorization</text>
    <text x="640" y="352">Scikit-learn classifier</text>
    <text x="640" y="398">Rule-based severity logic</text>

    <rect x="1120" y="180" width="360" height="520" rx="24" fill="#d9f99d" stroke="#4d7c0f" stroke-width="3"/>
    <text x="1160" y="250" font-weight="700">Delivery Layer</text>
    <text x="1160" y="306">FastAPI endpoints</text>
    <text x="1160" y="352">Streamlit dashboard</text>
    <text x="1160" y="398">Action guidance</text>
  </g>
  <g stroke="#166534" stroke-width="8" fill="none">
    <path d="M550 440 H590"/>
    <path d="M1050 440 H1100"/>
  </g>
</svg>
