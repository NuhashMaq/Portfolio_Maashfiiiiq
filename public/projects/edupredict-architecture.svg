<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="EduPredict architecture diagram">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="120" y="110" font-size="56" font-family="Segoe UI, Arial, sans-serif" fill="#0f172a" font-weight="700">EduPredict Architecture</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a" font-size="28">
    <rect x="120" y="180" width="400" height="520" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="160" y="250" font-weight="700">Data Sources</text>
    <text x="160" y="306">Student records</text>
    <text x="160" y="352">Attendance logs</text>
    <text x="160" y="398">Engagement events</text>

    <rect x="600" y="180" width="420" height="520" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="640" y="250" font-weight="700">ML Intelligence</text>
    <text x="640" y="306">Feature engineering</text>
    <text x="640" y="352">LightGBM + LR ensemble</text>
    <text x="640" y="398">SHAP explainability</text>

    <rect x="1100" y="180" width="380" height="520" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1140" y="250" font-weight="700">Application Layer</text>
    <text x="1140" y="306">FastAPI inference API</text>
    <text x="1140" y="352">Next.js dashboards</text>
    <text x="1140" y="398">RBAC admin + teacher</text>
  </g>
  <g stroke="#334155" stroke-width="8" fill="none">
    <path d="M530 440 H580"/>
    <path d="M1030 440 H1080"/>
  </g>
</svg>
